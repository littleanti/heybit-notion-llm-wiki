name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node 버전 · 의존성 0개 확인
        run: |
          node --version
          test ! -f package-lock.json
          node -e "const p=require('./package.json'); if (p.dependencies||p.devDependencies) process.exit(1)"
      - name: 테스트 (fixture · 골든 · mock Notion)
        run: npm test
      - name: 구조 lint (오류 0 — 경고는 허용)
        run: npm run lint
      - name: 색인이 최신인지 (build-index 재실행 후 차이 없음)
        run: |
          node .claude/skills/notion-llm-wiki/scripts/build-index.js
          git diff --exit-code -- wiki/index.md || (echo "wiki/index.md 가 최신이 아니다. build-index 를 돌려 커밋하라." && exit 1)
